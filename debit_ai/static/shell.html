<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI debit casefile — fictitious data</title>
<link rel="stylesheet" href="/static/app.css"></head>
<body data-view="inbox">

<div class="banner fict">100% FICTITIOUS DATA — Demo. Nothing here is a real debit.</div>
<div class="banner meta" id="provider">Configured provider: …</div>
